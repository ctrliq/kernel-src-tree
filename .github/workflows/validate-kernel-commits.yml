      - name: Install build dependencies for diffofdiffs
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 zlib1g-dev

      - name: Checkout libgit2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: libgit2/libgit2
          ref: 0060d9cf5666f015b1067129bd874c6cc4c9c7ac  # v1.9.1
          path: libgit2

      - name: Checkout diffofdiffs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ctrliq/diffofdiffs
          ref: 30c0b453c330e19bf5c597587ee47424e22258cc  # v1.0.0
          path: diffofdiffs

      - name: Checkout report tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ctrliq/kernel-src-tree
          # The caller's kernel branch doesn't contain the report tools
          ref: sultan_gha_diffofdiffs
          path: workflow-tools
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Build diffofdiffs
        run: |
          # Tree comparisons need libgit2 1.9.1 or newer, which the runner's
          # distribution may not provide. Keep this build in a private prefix.
          PREFIX="$RUNNER_TEMP/diffofdiffs-deps"
          cmake -S libgit2 -B libgit2/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DBUILD_TESTS=OFF -DBUILD_CLI=OFF \
            -DUSE_SSH=OFF -DUSE_HTTPS=OFF -DREGEX_BACKEND=builtin
          cmake --build libgit2/build --parallel "$(nproc)"
          cmake --install libgit2/build
          make -C diffofdiffs -j"$(nproc)" \
            CPPFLAGS="-I$PREFIX/include" \
            LDFLAGS="-L$PREFIX/lib -Wl,-rpath,$PREFIX/lib"

      - name: Compare backports with diffofdiffs
        id: diffofdiffs
        continue-on-error: true
        shell: python
        run: |
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys

          sys.path.insert(0, "workflow-tools/.github/scripts")
          from diffofdiffs_report import write_report

          def git_output(*args):
              return subprocess.run(
                  ["git", *args], check=True, text=True,
                  stdout=subprocess.PIPE,
              ).stdout

          def prepare_upstream(ref):
              try:
                  return git_output(
                      "rev-parse", "--quiet", "--verify", ref + "^{commit}",
                  ).strip()
              except subprocess.CalledProcessError:
                  # Let later fetches reuse the downloaded history
                  git_output(
                      "fetch", "--no-tags", "origin",
                      f"{ref}:refs/diffofdiffs/upstream/{ref}",
                  )
                  return git_output("rev-parse", "--verify", ref + "^{commit}").strip()

          reports = Path("diffofdiffs-reports")
          reports.mkdir()
          commits = git_output(
              "rev-list", "--reverse", "--topo-order",
              f"{os.environ['BASE_REF']}..{os.environ['HEAD_SHA']}", "--",
          ).splitlines()
          results = []
          html_reports = []

          for backport in commits:
              message = git_output("show", "-s", "--format=%B", backport)
              reference = re.search(r"^commit\s+([0-9a-fA-F]{12,40})", message, re.MULTILINE)
              if not reference:
                  continue
              # Anything that doesn't finish its comparison counts as failed
              result = {
                  "backport": backport,
                  "reference": reference[1],
                  "subject": message.splitlines()[0],
                  "status": "failed",
              }
              results.append(result)
              report = reports / f"{backport}.html"
              try:
                  result["upstream"] = prepare_upstream(reference[1])
              except subprocess.CalledProcessError as error:
                  print(f"{backport}: {error}", file=sys.stderr)
                  result["error"] = "couldn't fetch the upstream commit"
                  continue
              try:
                  subprocess.run([
                      "diffofdiffs/diffofdiffs", "--html", "--backport-labels",
                      "--git-tree=.", "-o", str(report), backport,
                      result["upstream"],
                  ], check=True)

                  # A successful comparison returns zero even when it differs.
                  # Only a nonempty report identifies a finding.
                  if not report.is_file() or report.stat().st_size == 0:
                      report.unlink(missing_ok=True)
                      result["status"] = "matches"
                      continue
                  html_reports.append({
                      "backport": backport,
                      "subject": result["subject"],
                      "html": report.read_text(encoding="utf-8", errors="replace"),
                  })
                  result["status"] = "differs"
              except subprocess.CalledProcessError as error:
                  report.unlink(missing_ok=True)
                  print(f"{backport}: {error}", file=sys.stderr)
                  result["error"] = f"diffofdiffs exited with status {error.returncode}"
              except OSError as error:
                  report.unlink(missing_ok=True)
                  print(f"{backport}: {error}", file=sys.stderr)
                  result["error"] = "the comparison couldn't be completed"

          # Record the results first so a report failure still gets a comment
          Path("diffofdiffs_results.json").write_text(
              json.dumps(results), encoding="utf-8",
          )
          if html_reports:
              write_report(html_reports, "backport-comparisons.html")
          sys.exit(any(result["status"] == "failed" for result in results))

      - name: Upload diffofdiffs HTML report
        id: diffofdiffs_reports
        if: always() && steps.diffofdiffs.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          path: backport-comparisons.html
          archive: false
          if-no-files-found: ignore
          retention-days: 90

      - name: Write comparison summary
        if: always() && steps.diffofdiffs.outcome != 'skipped'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_ID: ${{ steps.diffofdiffs_reports.outputs.artifact-id }}
          REPORT_URL: ${{ steps.diffofdiffs_reports.outputs.artifact-url }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys

          sys.path.insert(0, "workflow-tools/.github/scripts")
          from diffofdiffs_comment import render_comment

          results = Path("diffofdiffs_results.json")
          if not results.is_file():
              sys.exit()
          results = json.loads(results.read_text(encoding="utf-8"))
          repository = os.environ["GITHUB_REPOSITORY"]
          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}"

          # The retention period starts before the upload finishes, so ask
          # for the artifact's actual expiry rather than computing it.
          expires_at = None
          if os.environ["REPORT_ID"]:
              try:
                  expires_at = subprocess.run([
                      "gh", "api",
                      f"repos/{repository}/actions/artifacts/{os.environ['REPORT_ID']}",
                      "--jq", ".expires_at // empty",
                  ], check=True, text=True, stdout=subprocess.PIPE).stdout.strip() or None
              except subprocess.CalledProcessError:
                  print("::warning::Couldn't look up the report's expiry date")

          body, post = render_comment(
              results, repo_url=repo_url, pr_number=os.environ["PR_NUMBER"],
              run_url=f"{repo_url}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              report_url=os.environ["REPORT_URL"] or None,
              expires_at=expires_at,
              public=os.environ["REPOSITORY_PRIVATE"] != "true",
          )
          if post:
              Path("diffofdiffs_result.txt").write_text(body, encoding="utf-8")
          else:
              # Only replace an earlier comment, since nothing needs review
              Path("diffofdiffs_cleared.txt").write_text(body, encoding="utf-8")
              body = f"Compared {len(results)} backports; no differences found.\n"
          print(body, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(body)

      - name: Save PR metadata for comment workflow
        env:
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p pr_metadata

          # Save validated metadata
          echo "$PR_NUMBER" > pr_metadata/pr_number.txt
          echo "$REPOSITORY" > pr_metadata/repository.txt
          echo "$BASE_REF" > pr_metadata/base_ref.txt
          echo "$HEAD_SHA" > pr_metadata/head_sha.txt
          echo "$HEAD_REPO_FULL_NAME" > pr_metadata/head_repo.txt

          # Create a checksum of metadata for integrity verification
          (cd pr_metadata && sha256sum *.txt > checksums.txt)

      - name: Upload check results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()  # Upload even if checks fail
        with:
          name: check-results
          path: |
            diffofdiffs_result.txt
            diffofdiffs_cleared.txt
            pr_metadata/
          retention-days: 3  # Increased from 1 (then 3) to prevent premature deletion and support manual follow-ups

      - name: Fail on comparison errors
        if: always() && steps.diffofdiffs.outcome == 'failure'
        run: exit 1
