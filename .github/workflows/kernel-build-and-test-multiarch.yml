name: Automated kernel build and test x86_64 and aarch64

on:
  push:
    branches:
      - '*_ciqlts8_6'
  pull_request_target:
    branches:
      - '*_ciqlts8_6'
    types:
      - opened
      - synchronize
      - reopened
      - labeled

jobs:
  check-trust:
    runs-on: ubuntu-latest
    outputs:
      trusted: ${{ steps.check.outputs.trusted }}
    steps:
      - name: Remove approved-for-ci label on new commits from forks
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.action == 'synchronize' &&
          github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --remove-label "approved-for-ci" || true

      - name: Check if PR is trusted
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # On push events, always trusted
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "trusted=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Same-repo PRs are always trusted
          if [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            echo "trusted=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For forks: require 'approved-for-ci' label
          LABELS=$(gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json labels --jq '.labels[].name')

          if echo "$LABELS" | grep -q "approved-for-ci"; then
            echo "trusted=true" >> $GITHUB_OUTPUT
          else
            echo "trusted=false" >> $GITHUB_OUTPUT
            echo "::warning::PR from fork requires 'approved-for-ci' label to run CI"
          fi

  kernelCI:
    needs: check-trust
    if: needs.check-trust.outputs.trusted == 'true'
    uses: ctrliq/kernel-src-tree/.github/workflows/kernel-build-and-test-multiarch.yml@rnicolescu_test
    with:
      head_sha: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
