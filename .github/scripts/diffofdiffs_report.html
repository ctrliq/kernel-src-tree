<!doctype html>
<!-- SPDX-License-Identifier: GPL-2.0-only -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backport comparisons</title>
<script>
'use strict';
const browserTheme = window.matchMedia('(prefers-color-scheme: dark)');
document.documentElement.dataset.theme = browserTheme.matches ? 'dark' : 'light';
</script>
<style>
:root {
	color-scheme: light;
	--page: #f6f8fa;
	--surface: #fff;
	--text: #1f2328;
	--muted: #59636e;
	--border: #d1d9e0;
	--accent: #0969da;
	--highlight: #ddf4ff;
}
html[data-theme="dark"] {
	color-scheme: dark;
	--page: #0e151b;
	--surface: #14181e;
	--text: #f0f5fc;
	--muted: #b0bdcc;
	--border: #35434e;
	--accent: #9bcef0;
	--highlight: #223a4a;
}
* { box-sizing: border-box; }
body {
	margin: 0;
	height: 100vh;
	height: 100dvh;
	display: flex;
	flex-direction: column;
	color: var(--text);
	background: var(--page);
	font: 14px/1.5 system-ui, sans-serif;
}
header { border-bottom: 1px solid var(--border); }
.toolbar {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 10px 16px;
	max-width: 1600px;
	margin: auto;
	padding: 16px 32px;
}
.toolbar label, .report-choice { display: flex; align-items: center; gap: 7px; }
.report-choice { flex: 1; min-width: 240px; }
.report-menu { position: relative; flex: 1; min-width: 0; }
button, select { font: inherit; }
button, select {
	min-height: 34px;
	padding: 5px 10px;
	border: 1px solid var(--border);
	border-radius: 5px;
	background: var(--surface);
	color: var(--text);
}
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--accent); }
button:disabled { cursor: default; opacity: .6; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#report-select {
	display: flex;
	align-items: center;
	gap: 12px;
	width: 100%;
	text-align: left;
}
#report-select .report-title {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	text-overflow: ellipsis;
	white-space: nowrap;
}
#report-select::after {
	content: '';
	flex: none;
	width: 7px;
	height: 7px;
	margin: -4px 3px 0 0;
	border: solid currentColor;
	border-width: 0 2px 2px 0;
	transform: rotate(45deg);
}
#report-select[aria-expanded="true"]::after {
	margin-top: 4px;
	transform: rotate(225deg);
}
.report-title code {
	font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
	white-space: nowrap;
}
#report-options {
	position: absolute;
	z-index: 1;
	top: calc(100% + 4px);
	width: 100%;
	max-height: min(50vh, 360px);
	overflow: auto;
	padding: 4px;
	border: 1px solid var(--border);
	border-radius: 5px;
	background: var(--surface);
	box-shadow: 0 4px 12px #0003;
}
#report-options [role="option"] {
	padding: 7px 10px;
	border-radius: 3px;
	cursor: pointer;
	overflow-wrap: anywhere;
}
#report-options [aria-selected="true"] {
	background: var(--highlight);
	outline: 2px solid var(--accent);
	outline-offset: -2px;
}
.navigation { display: flex; align-items: center; gap: 10px; }
#report-position { color: var(--muted); font-size: 12px; white-space: nowrap; }
iframe { width: 100%; flex: 1; min-height: 0; border: 0; }
noscript { padding: 24px 32px; }
@media (max-width: 700px) {
	.toolbar { padding: 12px 16px; }
	.report-choice { flex-basis: 100%; }
}
</style>
</head>
<body>
<header aria-label="Backport comparisons">
	<div class="toolbar">
		<div class="report-choice">
			<span id="report-label">Report</span>
			<div class="report-menu">
				<button id="report-select" type="button" role="combobox"
					aria-labelledby="report-label" aria-controls="report-options"
					aria-haspopup="listbox" aria-expanded="false"></button>
				<div id="report-options" role="listbox" aria-labelledby="report-label" hidden></div>
			</div>
		</div>
		<div class="navigation">
			<button id="previous-report" type="button" aria-label="Previous report">Previous</button>
			<button id="next-report" type="button" aria-label="Next report">Next</button>
			<span id="report-position" role="status"></span>
		</div>
		<label>Theme <select id="theme-select">
			<option value="auto">Browser default</option>
			<option value="light">Light</option>
			<option value="dark">Dark</option>
		</select></label>
	</div>
</header>
<noscript>Enable JavaScript to select and view the backport comparisons.</noscript>
<iframe id="report" title="Backport comparison" sandbox="allow-scripts allow-downloads" allow="clipboard-write *"></iframe>
<script id="reports" type="application/json">@@REPORTS@@</script>
<script>
(() => {
	'use strict';
	const reports = JSON.parse(document.getElementById('reports').textContent);
	const select = document.getElementById('report-select');
	const list = document.getElementById('report-options');
	let frame = document.getElementById('report');
	const position = document.getElementById('report-position');
	const previous = document.getElementById('previous-report');
	const next = document.getElementById('next-report');
	const theme = document.getElementById('theme-select');
	let selected = -1;
	let active = -1;
	let search = '';
	let lastTyped = 0;

	function reportLabel(index) {
		const label = document.createElement('span');
		label.className = 'report-title';
		const number = document.createElement('strong');
		number.textContent = `${index + 1}.`;
		const sha = document.createElement('code');
		sha.textContent = reports[index].backport.slice(0, 12);
		label.append(number, ' ', sha, ' ', reports[index].subject);
		return label;
	}

	const options = reports.map((report, index) => {
		const option = document.createElement('div');
		option.id = `report-option-${index}`;
		option.setAttribute('role', 'option');
		option.append(reportLabel(index));
		option.addEventListener('click', () => chooseReport(index));
		option.addEventListener('pointermove', event => {
			if (event.pointerType === 'mouse' && active !== index)
				focusOption(index);
		});
		list.append(option);
		return option;
	});

	function focusOption(index) {
		active = Math.max(0, Math.min(index, reports.length - 1));
		for (const [i, option] of options.entries())
			option.setAttribute('aria-selected', String(i === active));
		select.setAttribute('aria-activedescendant', options[active].id);
		options[active].scrollIntoView({block: 'nearest'});
	}

	function openOptions(index = selected) {
		list.hidden = false;
		select.setAttribute('aria-expanded', 'true');
		focusOption(index);
	}

	function closeOptions() {
		list.hidden = true;
		select.setAttribute('aria-expanded', 'false');
		select.removeAttribute('aria-activedescendant');
		for (const [index, option] of options.entries())
			option.setAttribute('aria-selected', String(index === selected));
		search = '';
	}

	function currentTheme() {
		return theme.value === 'auto' ?
			(browserTheme.matches ? 'dark' : 'light') : theme.value;
	}

	function updateTheme() {
		const value = currentTheme();
		document.documentElement.dataset.theme = value;
		frame.contentWindow.postMessage({type: 'diffofdiffs-theme', theme: value}, '*');
	}

	/* This function runs inside each sandboxed report */
	function reportTheme(initialTheme) {
		const root = document.documentElement;

		function apply(value) {
			root.dataset.theme = value;
			const control = document.getElementById('theme-select');
			if (control)
				control.value = value;
		}

		apply(initialTheme);
		window.addEventListener('message', event => {
			if (event.source !== parent || event.data?.type !== 'diffofdiffs-theme')
				return;
			if (event.data.theme === 'light' || event.data.theme === 'dark')
				apply(event.data.theme);
		});
		document.addEventListener('DOMContentLoaded', () => {
			const control = document.getElementById('theme-select');
			if (control)
				control.closest('label').hidden = true;
			apply(root.dataset.theme);
		});
	}

	function showReport(index) {
		if (index === selected)
			return;
		selected = index;
		const report = reports[index];
		select.replaceChildren(reportLabel(index));
		closeOptions();
		position.textContent = `${index + 1} of ${reports.length}`;
		previous.disabled = index === 0;
		next.disabled = index === reports.length - 1;

		const page = new DOMParser().parseFromString(report.html, 'text/html');
		const bridge = page.createElement('script');
		bridge.textContent = `(${reportTheme.toString()})(${JSON.stringify(currentTheme())});`;
		page.head.prepend(bridge);
		/* A new frame keeps report loads out of the browser's history */
		const view = frame.cloneNode(false);
		view.title = `Backport ${report.backport.slice(0, 12)}: ${report.subject}`;
		view.srcdoc = '<!doctype html>\n' + page.documentElement.outerHTML;
		view.addEventListener('load', updateTheme);
		frame.replaceWith(view);
		frame = view;
	}

	function selectFromHash() {
		const index = reports.findIndex(report => report.backport === location.hash.slice(1));
		showReport(index < 0 ? 0 : index);
	}

	function chooseReport(index) {
		location.hash = reports[index].backport;
		showReport(index);
		closeOptions();
	}

	select.addEventListener('click', () => {
		if (list.hidden)
			openOptions();
		else
			closeOptions();
	});
	select.addEventListener('keydown', event => {
		const wasOpen = !list.hidden;
		switch (event.key) {
		case 'ArrowDown':
		case 'ArrowUp':
			event.preventDefault();
			if (event.altKey && event.key === 'ArrowUp' && wasOpen)
				chooseReport(active);
			else if (!wasOpen)
				openOptions(event.key === 'ArrowDown' ? selected : 0);
			else
				focusOption(active + (event.key === 'ArrowDown' ? 1 : -1));
			return;
		case 'Home':
		case 'End':
			event.preventDefault();
			openOptions(event.key === 'Home' ? 0 : reports.length - 1);
			return;
		case 'PageDown':
		case 'PageUp':
			if (wasOpen) {
				event.preventDefault();
				focusOption(active + (event.key === 'PageDown' ? 10 : -10));
			}
			return;
		case 'Enter':
		case ' ':
			event.preventDefault();
			if (wasOpen)
				chooseReport(active);
			else
				openOptions();
			return;
		case 'Escape':
			if (wasOpen) {
				event.preventDefault();
				closeOptions();
			}
			return;
		case 'Tab':
			if (wasOpen)
				chooseReport(active);
			return;
		}
		if (event.key.length !== 1 || event.ctrlKey || event.metaKey || event.altKey)
			return;
		event.preventDefault();
		if (!wasOpen)
			openOptions();
		const now = performance.now();
		search = (now - lastTyped < 700 ? search : '') + event.key.toLowerCase();
		lastTyped = now;
		const query = [...search].every(char => char === search[0]) ? search[0] : search;
		const start = query.length === 1 ? active + 1 : active;
		for (let offset = 0; offset < reports.length; offset++) {
			const index = (start + offset) % reports.length;
			const report = reports[index];
			if (options[index].textContent.toLowerCase().startsWith(query) ||
				report.subject.toLowerCase().startsWith(query) || report.backport.startsWith(query)) {
				focusOption(index);
				break;
			}
		}
	});
	/* Keep focus on the combobox while clicking an option */
	list.addEventListener('mousedown', event => event.preventDefault());
	select.addEventListener('blur', closeOptions);
	document.addEventListener('pointerdown', event => {
		if (!select.contains(event.target) && !list.contains(event.target))
			closeOptions();
	});
	previous.addEventListener('click', () => chooseReport(selected - 1));
	next.addEventListener('click', () => chooseReport(selected + 1));
	window.addEventListener('hashchange', selectFromHash);
	theme.addEventListener('change', updateTheme);
	browserTheme.addEventListener('change', updateTheme);
	window.addEventListener('pageshow', () => {
		closeOptions();
		updateTheme();
	});
	selectFromHash();
	updateTheme();
})();
</script>
</body>
</html>
